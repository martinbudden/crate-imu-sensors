[package]
name = "imu-sensors"
version = "0.1.4"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-imu-sensors"
description = "Drivers for a variety of IMU sensors."
keywords = ["IMU", "gyro", "gyroscope", "accelerometer", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
rustc_version = "0.4.1"

[features]
default = ["libm", "spi"]
#default = ["libm", "spi", "serde"]

# std is required for host testing
std = [
    #"embassy-executor",
    #"embassy-executor/platform-std",
    "embassy-time/std", 
    "embassy-time/generic-queue-8",     
    "vqm/std"
]

# Middleware & Core Math
libm = ["dep:libm", "vqm/libm"]
align = ["vqm/align"]
simd = ["vqm/simd"]
serde = ["dep:serde", "postcard", "sequential-storage", "vqm/serde"]

# Peripheral & Sensor Configuration Triggers
i2c = []
spi = []
lsm6ds3tr_c = []
ism330dhcx = []
lsm6dsox = []
# Coordinate Orientation - options to statically map the most common axis orientations.
axis_xpos_ypos_zpos = []
axis_ypos_xneg_zpos = []
axis_xneg_yneg_zpos = []
axis_yneg_xpos_zpos = []
axis_xpos_zpos_yneg = []

# Hardware Targets (Select one when building for microcontrollers)
# The "dep:" prefix activates the optional dependency without exposing it as a feature itself
rp = ["dep:embassy-rp"] # combined feature for all rp variants
rp2040 = ["rp", "embassy-rp/rp2040"]
rp235xa = ["rp", "embassy-rp/rp235xa", "embassy-rp/binary-info"]
rp235xb = ["rp", "embassy-rp/rp235xb", "embassy-rp/binary-info"]
stm32   = ["dep:embassy-stm32"]
esp32   = ["dep:esp-idf-hal"]

[dependencies]
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io", "experimental-derive"], optional = true }
sequential-storage = { version = "8.0.1", default-features = false, features = ["postcard"], optional = true }
vqm = { version = "0.1.16" }
#vqm = { git = "https://github.com/martinbudden/crate-vector-quaternion-matrix" }
#vqm = { path = "../vqm"  }

cfg-if = "1.0.4"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
#num_enum = { version = "0.7.6", default-features = false }

# Microcontroller-specific Embassy HAL (Marked optional = true so feature flags work)
embassy-rp = { version = "0.10.0", default-features = false, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"], optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true } 
esp-idf-hal = { version = "0.46.2", default-features = false, optional = true }

# General Embassy HAL (Marked optional = true to support the 'std' feature mapping)
#embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"], optional = true }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false, features = ["generic-queue-8"] }

# Use embedded-hal for I2C/SPI traits
embedded-hal = { version = "1.0.0", default-features = false }
embedded-hal-async = { version = "1.0.0", default-features = false }

# For logging and panic handling
log = { version = "0.4.32", default-features = false, optional = true }
panic-probe = { version = "1.0.0", default-features = false, features = ["print-defmt"], optional = true }
defmt = { version = "1.0.1", default-features = false, optional = true }
defmt-rtt = { version = "1.2.0", default-features = false, optional = true }
esp-println = { version = "0.17.0", features = ["log-04"], optional = true }

# --- DEV DEPENDENCIES (Only compiled for examples / tests) ---
[dev-dependencies]
pollster = { version = "1.0.1", default-features = false }
