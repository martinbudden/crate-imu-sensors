[package]
name = "imu-sensors-examples"
version = "0.1.0"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[build-dependencies]
# rustc_version = "0.4.1"

[features]

default = ["rp235xa"]

rp = ["dep:embassy-rp"] # combined feature for all rp variants
rp2040 = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp2040",
    "imu-sensors/rp2040"
]
rp235xa = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xa",
    "imu-sensors/rp235xa"
]
rp235xb = [
    "rp",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "embassy-executor/platform-cortex-m",
    "embassy-rp/time-driver",
    "embassy-rp/rp235xb",
    "imu-sensors/rp235xb"
]
stm32 = [
    "dep:embassy-stm32",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "embassy-executor/platform-cortex-m",
    "embassy-stm32/time-driver-tim2",
    "imu-sensors/stm32",
]
stm32f405 = ["embassy-stm32/stm32f405rg"]
esp32 = [
    "dep:esp-hal",
    "esp-hal/esp32s3",
    "imu-sensors/esp32"
]

[dependencies]
imu-sensors = { path = "..", default-features = false}

# Core Embassy executor and concurrency primitives
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread"] }
embassy-time = { version = "0.5.1", default-features = false }
# Hardware-specific Embassy HAL
embassy-rp = { version = "0.10.0", default-features = false, optional = true }
embassy-stm32 = { version = "0.6.0", default-features = false, optional = true }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
esp-hal = { version = "1.2.1", default-features = false, optional = true }

cortex-m = { version = "0.7.9", optional = true }
cortex-m-rt = { version = "0.7.6" , optional = true }

fixed = "1.31.0"
defmt = { version = "1.0.1" }
defmt-rtt = "1.3.0"
# defmt-test = "0.5.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# vqm = { version = "0.1.16" }

[[bin]]
name = "lsm6ds-rp-i2c"
path = "src/lsm6ds_rp_i2c.rs"

[[bin]]
name = "lsm6ds-rp-spi"
path = "src/lsm6ds_rp_spi.rs"

[profile.release]
debug = 2
lto = false
opt-level = 2
