[build]
# Automatically compile for the RP2350 core when running generic 'cargo build'
target = "thumbv8m.main-none-eabihf"

# Configuration for RP2040 (e.g., original Raspberry Pi Pico)
[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"
rustflags = [
    "-C",
    "link-arg=-Tlink.x",
]
# Configuration for RP2350 (e.g., Raspberry Pi Pico 2 ARM Core)
[target.thumbv8m.main-none-eabihf]
# Required flags for compilation and linking embedded binaries
rustflags = [
    "-C", "link-args=-Tlink.x -Tdefmt.x", 
    "-C", "no-vectorize-loops"
]

# Configuration for ESP32 S3
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[fallback]

# Tells cargo to use the host architecture when running tests or benches[alias]
[env]
# This cleanly sets the embassy task allocation memory size for all examples
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "32768"

[alias]
# Run using: 'cargo test-host'
test-host = "test --no-default-features --features std,libm --target x86_64-unknown-linux-gnu"

check-rp2040 = [
    "check",
    "--target", "thumbv6m-none-eabi",
    "--no-default-features",
    "--features",
    "rp2040"
]

check-rp235xa = [
    "check",
    "--target", "thumbv8m.main-none-eabihf",
    "--no-default-features",
    "--features",
    "rp235xa"
]
