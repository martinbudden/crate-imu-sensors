[build]
# Automatically compile for the RP2350 core when running generic 'cargo build'
#target = "thumbv8m.main-none-eabihf"

# Configuration for RP2040
[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"
rustflags = ["-C", "link-arg=-Tlink.x"]
# Configuration for RP2350
[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip RP2350"
rustflags = ["-C", "link-args=-Tlink.x -Tdefmt.x", "-C", "no-vectorize-loops"]

# Configuration for ESP32 S3
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[fallback]

# Tells cargo to use the host architecture when running tests or benches[alias]
[env]
# This cleanly sets the embassy task allocation memory size for all examples
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "32768"

[alias]
# Run using: 'cargo check-serde'
check-serde = "check --no-default-features --features vqm,serde"
check-storage = "check --no-default-features --features vqm,storage"

test-vqm = "test --no-default-features --features std,vqm"
test-nalgebra = "test --no-default-features --features std,nalgebra"
test-serde = "test --no-default-features --features std,vqm,serde"
test-storage = "test --no-default-features --features std,vqm,storage"

test-host = "test --no-default-features --features vqm,std,libm"

#check-esp32s3 = "run --manifest-path xtask/Cargo.toml -- check-esp32s3"

# Continuous Integration
ci = "run --package xtask --bin xtask"
# MSRV
check-msrv = "run --package xtask --bin xtask -- check-msrv"
